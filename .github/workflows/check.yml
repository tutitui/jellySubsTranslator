name: Check subtitle translator
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile worker/*.py scripts/prepare.py
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-plugin.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-subtitle-translator
          path: |
            artifacts/Jellyfin.Plugin.SubtitleTranslator.dll
            artifacts/Jellyfin.Plugin.SubtitleTranslator.deps.json
            artifacts/meta.json
